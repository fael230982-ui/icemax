services:
  postgres:
    image: postgres:16-alpine
    container_name: icemax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icemax
      POSTGRES_PASSWORD: icemax
      POSTGRES_DB: icemax
    ports:
      - "5432:5432"
    volumes:
      - icemax-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icemax -d icemax"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  icemax-postgres-data:
